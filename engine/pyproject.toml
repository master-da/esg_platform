[project]
name = "crbn-engine"
version = "0.1.0"
description = "Calculation, ingest and reporting engine for the ESG / carbon accounting platform"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: tests that need the local Supabase stack running"]

[tool.ruff]
line-length = 120
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
# B008: FastAPI's Depends()/File() defaults are the framework idiom.
# SIM117: nested `with` blocks mirror transaction/role scopes and read more clearly.
ignore = ["B008", "SIM117"]
